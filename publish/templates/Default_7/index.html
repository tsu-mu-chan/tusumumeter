<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>つむメーター - 3項目セット（Card）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        <!-- 画像ファイル名：Default_7.png -->
        <img src="Default_7.png" class="frame-image" alt="frame">
        
        <!-- 数字を表示するオーバーレイ -->
        <div class="content-overlay">
            <!-- 上段：同接数 -->
            <div class="stat-item v-item">
                <span class="count count-beige" id="viewer-count">0</span>
            </div>
            <!-- 中段：高評価数 -->
            <div class="stat-item l-item">
                <span class="count count-beige" id="like-count">0</span>
            </div>
            <!-- 下段：チャンネル登録者数 -->
            <div class="stat-item s-item">
                <span class="count count-beige" id="sub-count">0</span>
            </div>
        </div>
    </div>

    <script>
        const viewerElement = document.getElementById('viewer-count');
        const likeElement = document.getElementById('like-count');
        const subElement = document.getElementById('sub-count');

        // C# WebSocket サーバー接続
        function connectWebSocket() {
            const ws = new WebSocket('ws://localhost:8081/');

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // 同時視聴者数
                    if (viewerElement && data.viewers !== undefined) {
                        const num = parseInt(data.viewers, 10);
                        viewerElement.textContent = !isNaN(num) ? num.toLocaleString() : data.viewers;
                    }

                    // 高評価数
                    if (likeElement && data.likes !== undefined) {
                        const num = parseInt(data.likes, 10);
                        likeElement.textContent = !isNaN(num) ? num.toLocaleString() : data.likes;
                    }

                    // チャンネル登録者数
                    if (subElement && data.subs !== undefined && data.subs !== "0" && data.subs !== "") {
                        const num = parseInt(data.subs, 10);
                        subElement.textContent = !isNaN(num) ? num.toLocaleString() : data.subs;
                    }

                } catch (e) {
                    console.error("JSONパースエラー:", e);
                }
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocketエラー:", err);
                ws.close();
            };
        }

        connectWebSocket();
    </script>
</body>
</html>
