<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>つむメーター - 同接数（Pink）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        <!-- 画像ファイル名：Default_5.png -->
        <img src="Default_5.png" class="frame-image" alt="frame">
        
        <div class="content-overlay">
            <div class="stat-item viewer-pink-item">
                <span class="count count-pink" id="viewer-count">0</span>
            </div>
        </div>
    </div>

    <script>
        const viewerElement = document.getElementById('viewer-count');

        // C# WebSocket サーバー接続
        function connectWebSocket() {
            const ws = new WebSocket('ws://localhost:8081/');

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // 同時視聴者数の更新
                    if (viewerElement && data.viewers !== undefined) {
                        const num = parseInt(data.viewers, 10);
                        viewerElement.textContent = !isNaN(num) ? num.toLocaleString() : data.viewers;
                    }

                } catch (e) {
                    console.error("JSONパースエラー:", e);
                }
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocketエラー:", err);
                ws.close();
            };
        }

        connectWebSocket();
    </script>
</body>
</html>
